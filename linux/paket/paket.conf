# shellcheck shell=bash
# ============================================================================
# Rosenweg Zutritt — welches Paket, wo es liegt, woran man es erkennt
# ============================================================================
# VORLAGE fuer Rosenweg/os-stationen pakete/rosenweg-zutritt/paket.conf
# (dorthin kopieren, zusammen mit hochladen.sh aus pakete/rosenweg-salz/).
# Gelesen von hochladen.sh, lib/common.sh (rosenweg_paket_einspielen,
# aufgerufen aus roles/desktop/parts/56-rosenweg-apps.sh) und
# roles/desktop/parts/60-programme.sh (SEITE, STARTER).
#
# Gebaut wird NICHT dort, sondern im App-Repo Rosenweg/rosenweg-zutritt: ein
# Merge auf main mit neuer Version legt das Release vX.Y.Z mit
# rosenweg-zutritt_<VERSION>_amd64.deb an (rosenweg-basis app.yml). Die
# Stationen nehmen genau diese Datei, verteilt vom PXE-Server (CT 135,
# /srv/pxe/pakete/); die Pruefsumme unten entscheidet. Auf den Stationen ist
# der Updater der App aus (rosenweg_basis erkennt /etc/rosenweg-station/).
#
# Neues Paket:
#   1. .deb aus dem Release holen:
#        gh release download vX.Y.Z --repo Rosenweg/rosenweg-zutritt -p '*.deb'
#   2. VERSION und SHA256_amd64 (shasum -a 256) hier eintragen
#   3. pakete/rosenweg-zutritt/hochladen.sh <pfad zum .deb>
#   4. committen, veroeffentlichen (erst test, dann main)
# ============================================================================

# Aus pubspec.yaml: 0.1.0+1 -> 0.1.0-1.
VERSION=0.1.0-1

# Pruefsumme des .deb aus dem Release (noch keines).
SHA256_amd64=

PFAD_AUF_PXE=/pxe/pakete

# Wer die App im Menue sieht: dieselben Gruppen wie die Web-Seite mit dieser
# Kennung (/api/stations/<id>/apps, Rosenweg/Website api/lib/stationapps.js).
SEITE=rosenweg-access
STARTER=ch.rosenweg4303.zutritt.desktop
